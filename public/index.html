<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>myWIPhealing — Seni Scape Impact Survey</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  header.survey {
    background: var(--myrtle); color: var(--white);
    padding: 16px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    text-align: center; flex-shrink: 0; position: relative;
  }
  header.survey::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--banana); }
  header.survey h1 { font-size: 1.1rem; color: var(--white); }
  header.survey p { font-size: .78rem; color: rgba(255,255,255,.82); margin-top: 3px; font-weight: 500; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%; padding: 11px 15px; border-radius: 18px;
    font-size: .95rem; line-height: 1.5; white-space: pre-wrap;
    word-wrap: break-word; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.ai { background: var(--white); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
  .msg.user { background: var(--myrtle); color: var(--white); align-self: flex-end; border-bottom-right-radius: 5px; }
  .msg.typing { color: var(--muted); font-style: italic; background: var(--white); box-shadow: var(--shadow); }
  .msg.error { background: #FCE3D4; color: var(--warn); align-self: center; font-size: .85rem; border-radius: 12px; }
  form {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--white); border-top: 1px solid var(--line); flex-shrink: 0;
  }
  #input {
    flex: 1; border: 1px solid var(--line); border-radius: 22px;
    padding: 11px 16px; font-size: 16px; outline: none; resize: none;
    font-family: inherit; max-height: 110px; color: var(--ink);
  }
  #input:focus { border-color: var(--myrtle); }
  #send {
    background: var(--banana-bright); color: var(--ink); border: none; border-radius: 50%;
    width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer;
    flex-shrink: 0; align-self: flex-end; transition: background .15s, color .15s;
  }
  #send:hover { background: var(--coral); color: var(--white); }
  #send:disabled { opacity: .5; }
  .done-banner {
    background: var(--banana-pastel); color: var(--ink); text-align: center;
    padding: 12px 16px; border-radius: 12px; font-weight: 700; align-self: center;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 8px; max-width: 92%;
    align-self: flex-start; animation: pop .18s ease-out;
  }
  .chip {
    background: var(--white); color: var(--ink); border: 1.5px solid var(--ink);
    border-radius: var(--radius-pill); padding: 9px 15px; font-size: .9rem;
    font-family: inherit; cursor: pointer; text-align: left; transition: background .12s, color .12s;
  }
  .chip:hover { background: var(--banana-bright); }
  .chip:active { background: var(--coral); color: var(--white); border-color: var(--coral); }
</style>
</head>
<body>
<header class="survey">
  <h1>Seni Scape Impact Survey</h1>
  <p>Your voice matters &#129293; Suara anda bermakna &#129293;</p>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Type your answer... / Taip jawapan anda..." autocomplete="off"></textarea>
  <button id="send" type="submit" aria-label="Send">&#10148;</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

let messages = [];
let busy = false;
let chipRow = null;

function addBubble(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function clearChips() {
  if (chipRow) { chipRow.remove(); chipRow = null; }
}

function showChips(options) {
  clearChips();
  chipRow = document.createElement("div");
  chipRow.className = "chips";
  for (const opt of options) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = opt;
    b.onclick = () => sendAnswer(opt);
    chipRow.appendChild(b);
  }
  chat.appendChild(chipRow);
  chat.scrollTop = chat.scrollHeight;
}

async function sendAnswer(text) {
  if (!text || busy) return;
  clearChips();
  messages.push({ role: "user", content: text });
  addBubble(text, "user");
  await callAI();
}

async function callAI() {
  busy = true;
  send.disabled = true;
  const typing = addBubble("typing... / menaip...", "ai typing");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) throw new Error(data.error || "Server error");
    messages.push({ role: "assistant", content: data.raw || data.reply });
    addBubble(data.reply, "ai");
    if (data.done) {
      form.style.display = "none";
      addBubble("✅ Survey complete. Thank you! / Tinjauan selesai. Terima kasih!", "done-banner");
    } else if (Array.isArray(data.options) && data.options.length) {
      showChips(data.options);
    }
  } catch (e) {
    typing.remove();
    addBubble("⚠️ " + e.message + " - please try again / sila cuba lagi", "error");
  } finally {
    busy = false;
    send.disabled = false;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  await sendAnswer(text);
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 110) + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// kick off: ask the AI for its greeting + first question
callAI();
</script>
</body>
</html>
