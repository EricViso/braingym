<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myWIPhealing — Harmoni Circles Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<style>
  #login { max-width: 360px; margin: 16vh auto; text-align: center; }
  #login input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; margin: 8px 0 12px; }
  #loginError { color: var(--warn); font-size: .85rem; min-height: 1em; }
  .login-title { font-size: 20px; margin-bottom: 10px; }
  .who-acct { font-size: 11px; background: var(--accent-soft); border-radius: var(--radius-pill); padding: 1px 8px; font-weight: 600; margin-left: 4px; }
  .memtable { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .memtable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 6px 10px 6px 0; }
  .memtable td { padding: 8px 10px 8px 0; border-top: 1px solid var(--line-soft); }
  .memtable td.n { text-align: right; font-family: var(--font-mono); }
  .mav { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; display: inline-grid; place-items: center; background: var(--accent-soft); font-weight: 700; font-size: 12px; border: 1px solid var(--line); }
  .memtable th.n { text-align: right; }
  .tablewrap { overflow-x: auto; }
  .prop .cov.img { overflow: hidden; border: 1px solid var(--line); }
  .prop .cov.img img { width: 100%; height: 100%; object-fit: cover; }
  .payblock { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); font-size: 13px; }
  .payblock.missing { border-color: var(--accent); background: var(--accent-soft); }
  .payrow { display: flex; gap: 8px; margin-top: 6px; }
  .payrow input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  .paywarn { margin-top: 6px; font-weight: 600; color: var(--accent); }
  .paid { color: var(--good); font-weight: 700; }
  .btn.mini { padding: 3px 9px; font-size: 11px; }

  .prop { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .prop summary { cursor: pointer; list-style: none; display: flex; gap: 14px; align-items: center; padding: 16px 18px; flex-wrap: wrap; }
  .prop summary::-webkit-details-marker { display: none; }
  .prop .cov { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex: 0 0 auto; }
  .prop .ttl { flex: 1; min-width: 200px; }
  .prop .ttl h4 { font-size: 15.5px; }
  .prop .ttl .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .prop .body { padding: 4px 18px 18px; border-top: 1px solid var(--line-soft); }
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .kv { width: 100%; border-collapse: collapse; font-size: .83rem; margin-top: 6px; }
  .kv td { padding: 5px 8px 5px 0; border-top: 1px solid var(--line-soft); vertical-align: top; }
  .kv td:first-child { color: var(--muted); width: 42%; }
  .desc { font-size: .87rem; line-height: 1.55; white-space: pre-wrap; margin-top: 6px; }

  .fin { background: var(--myrtle); color: var(--white); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
  .fin .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .fin .row.t { border-top: 1px solid rgba(255,255,255,.25); margin-top: 5px; padding-top: 8px; font-weight: 700; }
  .fin .neg { color: #FFB4A2; }
  .fin .pos { color: var(--banana-bright); }
  .fin .eq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .fin .eq > div { background: rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; }
  .fin .eq .l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; opacity: .8; }
  .fin .eq .v { font-family: var(--font-mono); font-size: 15px; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .note { font-size: 12.5px; color: var(--muted-strong); font-style: italic; }
  .rsvptable { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 6px; }
  .rsvptable th, .rsvptable td { text-align: left; padding: 4px 8px 4px 0; border-top: 1px solid var(--line-soft); }
  .sec { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
  .sec .count { background: var(--accent-soft); border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 700; padding: 3px 11px; }
  .wl { color: var(--warn); font-weight: 700; }
  .cmt { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line-soft); }
  .attachgrid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .attachgrid a { text-decoration: none; color: var(--ink); }
  .attachgrid img { width: 110px; height: 110px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .attachgrid .pdf { width: 110px; height: 110px; border-radius: 10px; border: 1px solid var(--line); background: var(--accent-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; gap: 4px; overflow: hidden; padding: 6px; text-align: center; }
  .attachgrid .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Request changes: edit the proposal in place and flag fields for the host */
  .rc { margin-top: 14px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--card); padding: 14px 16px; }
  .rc h4 { font-size: 14px; }
  .rc .rchelp { font-size: 12.5px; color: var(--muted-strong); margin: 4px 0 10px; line-height: 1.5; }
  .rc details.rcsec { border-top: 1px solid var(--line-soft); padding: 8px 0; }
  .rc details.rcsec > summary { cursor: pointer; font-weight: 700; font-size: 13px; display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .rc .rcbadge { font-size: 10.5px; font-weight: 700; border-radius: var(--radius-pill); padding: 1px 8px; background: var(--accent-soft); }
  .rc .rcbadge:empty { display: none; }
  .rcrow { padding: 8px 0 8px 10px; border-left: 3px solid transparent; margin: 4px 0; }
  .rcrow.changed { border-left-color: var(--good); background: rgba(42,111,43,.06); }
  .rcrow.flagged { border-left-color: var(--warn); background: rgba(200,80,40,.06); }
  .rcrow.changed.flagged { border-left-color: var(--warn); }
  .rchead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .rcflag { font-weight: 500; font-size: 12px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--muted-strong); }
  .rcrow input:not([type=checkbox]), .rcrow textarea, .rcrow select, .rc .rcnote { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13px; background: #fff; }
  .rcrow textarea, .rc .rcnote { resize: vertical; line-height: 1.45; }
  .rcrow .rcflagnote { margin-top: 6px; border-color: var(--warn); }
  .rcrow .rcwas { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  .rcrow .rcwas button { font-size: 11px; margin-left: 4px; }
  .rcrow .rcro { font-size: 12.5px; color: var(--muted-strong); }
  .rcfoot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .rcfoot .rcsum { font-size: 12px; color: var(--muted-strong); margin-right: auto; }
  .rcerr { color: var(--warn); font-size: 12.5px; font-weight: 600; margin-top: 6px; min-height: 1em; }
  .revbox { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; background: var(--accent-soft); }
  .revbox h5 { font-size: 12.5px; margin: 8px 0 4px; }
  .revbox h5:first-child { margin-top: 0; }
  .revbox ul { margin: 0; padding-left: 18px; }
  .revbox li { margin: 3px 0; }
  .revbox .from { color: var(--muted); text-decoration: line-through; }
  .emailnotice { border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; margin: 10px 0; word-break: break-word; }
  .emailnotice.ok { background: rgba(42,111,43,.1); }
  .emailnotice.bad { background: #FFE2D6; font-weight: 600; }
</style>
</head>
<body class="theme-harmoni">

<div id="login" class="card" style="display:none">
  <h2 class="login-title">🔐 Harmoni Circles Admin</h2>
  <input type="password" id="pw" placeholder="Admin password" autofocus>
  <button class="btn btn-primary" style="width:100%" onclick="login()">Enter</button>
  <div id="loginError"></div>
</div>

<div id="dash" class="wrap stack" style="display:none">
  <div class="appbar">
    <div>
      <div class="brand-mark"><h1>myWIPhealing <span class="accent">Harmoni Circles</span></h1></div>
      <div class="subtitle">Member proposals & events · review the numbers, approve, track RSVPs</div>
    </div>
    <div class="bar-actions">
      <a class="btn btn-banana btn-sm" href="/circle/" target="_blank">Member view ↗</a>
      <button class="btn btn-on-dark btn-sm" onclick="location.href='/admin.html'">← Admin Hub</button>
      <button class="btn btn-on-dark btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <div id="emailNotice" class="emailnotice" role="status" hidden></div>
  <div id="content"></div>
  <div class="foot">
    <span class="brand">myWIPhealing · Harmoni Circles</span>
    <span>Restricted access · proposals contain member contact details</span>
    <span>Powered by Gym Brain</span>
  </div>
</div>

<script>
let token = sessionStorage.getItem("adminToken") || "";
let CONFIG = { facilitatorShare: 50, currency: "RM" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtRM = (n) => "RM " + Number(n || 0).toLocaleString("en-MY", { maximumFractionDigits: 2 });
const STATUS_TAG = {
  under_review: '<span class="tag flag">under review</span>',
  needs_revision: '<span class="tag flag">to revise</span>',
  approved: '<span class="tag pos">approved</span>',
  rejected: '<span class="tag neg">rejected</span>',
  completed: '<span class="tag">completed</span>',
  cancelled: '<span class="tag neg">cancelled</span>',
};

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Server error");
  return data;
}

async function login() {
  $("loginError").textContent = "";
  try {
    const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    token = data.token; sessionStorage.setItem("adminToken", token);
    showDash();
  } catch (e) { $("loginError").textContent = e.message; }
}

function logout() {
  token = ""; sessionStorage.removeItem("adminToken");
  $("dash").style.display = "none"; $("login").style.display = "block";
}

async function showDash() {
  $("login").style.display = "none"; $("dash").style.display = "block";
  try {
    const d = await api("/api/admin/harmoni/events");
    CONFIG = d.config;
    render(d.events || []);
  } catch (e) {
    $("content").innerHTML = `<div class="card">⚠️ ${esc(e.message)}</div>`;
  }
}

function finBlock(fin) {
  if (!fin) return "";
  return `<div class="fin">
    <div class="row"><span>Projected revenue (attendees × price)</span><span>${fmtRM(fin.projectedRevenue)}</span></div>
    <div class="row"><span>Total cost to host</span><span>${fmtRM(fin.totalCost)}</span></div>
    <div class="row t"><span>Projected profit</span><span class="${fin.projectedProfit < 0 ? "neg" : "pos"}">${fmtRM(fin.projectedProfit)}</span></div>
    <div class="eq">
      <div><div class="l">Facilitator ${esc(String(fin.facilitatorShare))}%</div><div class="v">${fmtRM(fin.facilitatorPayout)}</div></div>
      <div><div class="l">WIP ${esc(String(100 - fin.facilitatorShare))}%</div><div class="v">${fmtRM(fin.orgPayout)}</div></div>
    </div>
  </div>`;
}

function proposalCard(ev) {
  const d = ev.data || {};
  const when = d.dateTime ? new Date(d.dateTime).toLocaleString("en-MY", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "—";
  const WHO = { host: "Host", circle: "Circle (WIP)", participants: "Participants" };
  const costs = (d.costs || []).map((c) => `<tr><td>${esc(c.item)}</td><td>${esc(WHO[c.who] || c.who || "")}</td><td style="text-align:right">${fmtRM(c.rm)}</td></tr>`).join("");
  const actions = [];
  if (ev.status === "under_review") {
    actions.push(`<button class="btn btn-banana btn-sm" onclick="setStatus('${esc(ev.id)}','approved')">Approve & publish</button>`);
    actions.push(`<button class="btn btn-outline btn-sm" onclick="openChanges('${esc(ev.id)}')">Request changes…</button>`);
    actions.push(`<button class="btn btn-outline btn-sm" onclick="setStatus('${esc(ev.id)}','rejected')">Reject…</button>`);
  }
  if (ev.status === "needs_revision") {
    actions.push(`<button class="btn btn-banana btn-sm" onclick="setStatus('${esc(ev.id)}','approved')">Approve as is</button>`);
    actions.push(`<button class="btn btn-outline btn-sm" onclick="openChanges('${esc(ev.id)}')">Change the request…</button>`);
    actions.push(`<button class="btn btn-outline btn-sm" onclick="setStatus('${esc(ev.id)}','rejected')">Reject…</button>`);
  }
  if (ev.status === "approved") {
    actions.push(`<button class="btn btn-banana btn-sm" onclick="setStatus('${esc(ev.id)}','completed')">Mark completed</button>`);
    actions.push(`<button class="btn btn-outline btn-sm" onclick="setStatus('${esc(ev.id)}','cancelled')">Cancel…</button>`);
  }
  if (ev.status === "rejected" || ev.status === "cancelled") {
    actions.push(`<button class="btn btn-outline btn-sm" onclick="setStatus('${esc(ev.id)}','under_review')">Back to review</button>`);
  }
  if (ev.status === "completed") {
    actions.push(`<button class="btn btn-outline btn-sm" onclick="setStatus('${esc(ev.id)}','approved')">Re-open</button>`);
  }

  const rsvps = Array.isArray(d.rsvps) ? d.rsvps : [];
  const going = rsvps.filter((r) => r.status === "going" && !r.waitlisted);
  const wait = rsvps.filter((r) => r.waitlisted);
  const maybe = rsvps.filter((r) => r.status === "maybe");
  const goingPax = going.reduce((s, r) => s + r.pax, 0);
  const rsvpKey = (r) => r.memberId || `name:${r.name}`;
  const payCell = (r) => {
    if (r.status !== "going" || r.waitlisted) return "";
    const act = (action, label) => `<button class="btn btn-outline btn-sm mini" onclick="rsvpAction('${esc(ev.id)}', '${esc(rsvpKey(r))}', '${action}')">${label}</button>`;
    if (r.paymentStatus === "paid") return `<span class="paid">paid</span> ${act("unpaid", "Undo")}`;
    if (r.paymentStatus === "pending") return `<span class="wl">pending</span> ${act("paid", "Mark paid")}`;
    return '<span class="muted">—</span>';
  };
  const rsvpTable = (list) => list.length
    ? `<table class="rsvptable"><tr><th>Name</th><th>Pax</th><th>Status</th><th>Payment</th><th>When</th><th></th></tr>` +
      list.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.pax}</td><td>${r.waitlisted ? '<span class="wl">waitlist</span>' : esc(r.status)}</td><td>${payCell(r)}</td><td>${esc(new Date(r.at).toLocaleString("en-MY", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }))}</td>
        <td><button class="btn btn-outline btn-sm mini" onclick="rsvpAction('${esc(ev.id)}', '${esc(rsvpKey(r))}', 'remove')" title="Remove this RSVP">×</button></td></tr>`).join("") +
      `</table>`
    : '<div class="muted" style="font-size:12.5px">No RSVPs yet.</div>';

  // Payment link members are sent to when they RSVP "going". Paid Circles
  // can't take "going" RSVPs until one is set.
  const needsLink = Number(d.ticketPrice) > 0;
  const payBlock = ev.status === "approved" || ev.status === "under_review" ? `
    <div class="payblock ${needsLink && !d.paymentUrl ? "missing" : ""}">
      <label for="pay_${esc(ev.id)}"><strong>Payment link</strong> ${needsLink ? `for ${fmtRM(d.ticketPrice)} per person` : "(free Circle, not needed)"}</label>
      <div class="payrow">
        <input id="pay_${esc(ev.id)}" type="url" placeholder="https://… (ToyyibPay, Billplz, Stripe payment link…)" value="${esc(d.paymentUrl || "")}">
        <button class="btn btn-banana btn-sm" onclick="savePaymentLink('${esc(ev.id)}')">Save</button>
      </div>
      ${needsLink && !d.paymentUrl ? `<div class="paywarn">Members can't RSVP "going" until this is set.</div>` : ""}
    </div>` : "";
  const comments = (Array.isArray(d.comments) ? d.comments : []).map((c) =>
    `<div class="cmt"><strong>${esc(c.name)}</strong> <span class="muted" style="font-size:11px">${esc(new Date(c.at).toLocaleString())}</span><br>${esc(c.text)}</div>`).join("");

  const planRow = (label, val) => (val ? `<tr><td>${esc(label)}</td><td>${esc(val)}</td></tr>` : "");
  const planText = (label, val) => (val ? `<h4 style="margin-top:10px;font-size:12.5px">${esc(label)}</h4><div class="desc">${esc(val)}</div>` : "");

  return `<details class="prop" ${ev.status === "under_review" ? "open" : ""}>
    <summary>
      ${d.coverImage
        ? `<span class="cov img"><img src="${d.coverImage.data}" alt="Cover photo"></span>`
        : `<span class="cov" style="background:linear-gradient(120deg, ${esc(d.cover ? d.cover.from : "#F5EFE6")}, ${esc(d.cover ? d.cover.to : "#DEFFA9")})">${esc(d.cover ? d.cover.emoji : "🌿")}</span>`}
      <span class="ttl"><h4>${esc(d.title)}</h4>
        <div class="sub">${esc(d.sessionType || "")} · ${esc(when)} · ${esc(d.venueName || "")} · theme: ${esc(d.theme || "—")} · submitted ${esc(new Date(ev.submittedAt).toLocaleDateString("en-MY", { day: "numeric", month: "short" }))}</div>
      </span>
      ${STATUS_TAG[ev.status] || ""}
      ${ev.status === "approved" ? `<span class="tag">${goingPax}/${d.capacity || "?"} going</span>` : ""}
    </summary>
    <div class="body cols">
      <div>
        <table class="kv">
          <tr><td>When / duration</td><td>${esc(when)} · ${esc(d.duration || "—")}</td></tr>
          <tr><td>Where</td><td>${esc({ physical: "Physical", online: "Online", hybrid: "Hybrid" }[d.venueMode] || "")} — ${esc(d.venueName || "")}${d.venueAddress ? " · " + esc(d.venueAddress) : ""}</td></tr>
          ${planRow("Venue notes", d.venueNotes)}
          ${planRow("Audience", d.audience)}
          <tr><td>Participants</td><td>${esc(String(d.minCapacity || 1))} min · ${esc(String(d.capacity))} max</td></tr>
          ${planRow("Preparation", d.prep)}
          <tr><td>Ticket / proj. attendees</td><td>${fmtRM(d.ticketPrice)} · ${esc(String(d.projectedAttendees))} expected${d.costPerParticipant != null ? ` · ~${fmtRM(d.costPerParticipant)}/participant materials` : ""}</td></tr>
          <tr><td>Facilitator</td><td>${esc(d.contactName || "")} · ${esc(d.contactEmail || "")}</td></tr>
          ${d.createdBy ? `<tr><td>Submitted from account</td><td>${esc(d.createdBy.name || "")} · ${esc(d.createdBy.email || "")}<span class="who-acct">member</span></td></tr>` : ""}
          ${ev.decidedAt ? `<tr><td>Last decision</td><td>${esc(ev.decidedBy || "admin")} on ${esc(new Date(ev.decidedAt).toLocaleString())}</td></tr>` : ""}
          ${ev.adminNote ? `<tr><td>Admin note</td><td class="note">${esc(ev.adminNote)}</td></tr>` : ""}
        </table>

        <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;font-weight:700">🌀 Full session plan (host framework)</summary>
          ${planText("1 · What participants will do", d.coreActivity)}
          ${d.reference ? `<div class="desc" style="font-size:12px">🔗 <a href="${esc(d.reference)}" target="_blank" rel="noopener">${esc(d.reference)}</a></div>` : ""}
          ${planText("2 · Flow", d.flow)}
          ${planText("4 · What they walk away with", d.takeaway)}
          ${planText("4 · Deeper intention", d.intention)}
          ${planText("5 · Theme — in their words (" + (d.theme || "") + ")", d.themeExplain)}
          ${planText("5 · Key message", d.keyMessage)}
          ${planText("7 · Opening", d.opening)}
          ${planText("7 · Step-by-step instructions", d.instructions)}
          ${planText("7 · Closing", d.closing)}
          ${planText("8 · Reflection prompts", d.prompts)}
          ${planText("9 · Help needed", d.help)}
          ${planText("9 · Accessibility", d.accessibility)}
          ${planText("9 · Anything else", d.other)}
        </details>

        <h4 style="margin-top:14px;font-size:13px">Materials &amp; resources</h4>
        <table class="kv"><tr><th style="text-align:left">Item</th><th style="text-align:left">Provided by</th><th style="text-align:right">Cost</th></tr>${costs || '<tr><td class="muted">None listed</td></tr>'}</table>
        ${(d.attachments && d.attachments.length) ? `
        <h4 style="margin-top:14px;font-size:13px">Workshop experience attachments (${d.attachments.length})</h4>
        <div class="attachgrid">${d.attachments.map((a) => {
          const inner = a.type === "application/pdf"
            ? `<div class="pdf">📄<span style="word-break:break-all">${esc(a.name)}</span></div>`
            : `<img src="${a.data}" alt="${esc(a.name)}">`;
          return `<a href="${a.data}" download="${esc(a.name)}" title="${esc(a.name)}">${inner}<div class="cap">${esc(a.name)}</div></a>`;
        }).join("")}</div>` : ""}
        ${finBlock(d.financials)}
        ${payBlock}
        ${revisionBox(ev)}
        <div class="actions" id="act_${esc(ev.id)}">${actions.join("")}
          ${ev.status !== "under_review" ? `<button class="btn btn-outline btn-sm" onclick="setStatus('${esc(ev.id)}','under_review')">→ Review</button>` : ""}
        </div>
        <div id="rc_${esc(ev.id)}"></div>
      </div>
      <div>
        ${ev.status === "approved" || ev.status === "completed" ? `
        <h4 style="font-size:13px">RSVPs — going (${going.length}, ${goingPax} pax)</h4>${rsvpTable(going)}
        ${wait.length ? `<h4 style="font-size:13px;margin-top:10px">Waitlist (${wait.length})</h4>${rsvpTable(wait)}` : ""}
        ${maybe.length ? `<h4 style="font-size:13px;margin-top:10px">Maybe (${maybe.length})</h4>${rsvpTable(maybe)}` : ""}
        <h4 style="font-size:13px;margin-top:14px">Comments (${(d.comments || []).length})</h4>
        ${comments || '<div class="muted" style="font-size:12.5px">No comments yet.</div>'}` : ""}
      </div>
    </div>
  </details>`;
}

// ---------- Request changes ----------
//
// Instead of a one-line prompt, the admin gets the proposal as an editable
// form. Edits are applied straight away (the host checks and accepts them
// when they resubmit); a field can also be flagged with a note for the host
// to rework themselves. Field keys and labels match REVISION_FIELDS in app.js.

const RC_SECTIONS = [
  ["Session identity", [
    ["title", "Session title", "text"], ["coverImage", "Cover photo", "flag"], ["sessionType", "Session type", "text"],
    ["audience", "Who it's for", "text"], ["dateTime", "Date & time", "datetime"], ["duration", "Duration", "text"]]],
  ["The activity", [
    ["coreActivity", "What participants will do", "long"], ["flow", "Session flow", "long"],
    ["reference", "Reference link", "text"], ["attachments", "Photos / PDFs of past work", "flag"]]],
  ["Location & logistics", [
    ["venueMode", "In person / online", "mode"], ["venueName", "Venue", "text"], ["venueAddress", "Venue address", "text"],
    ["venueNotes", "Venue booking notes", "long"], ["minCapacity", "Smallest group", "int"], ["capacity", "Largest group", "int"],
    ["prep", "Setup & preparation", "long"]]],
  ["Objectives & theme", [
    ["takeaway", "What people walk away with", "long"], ["intention", "Deeper intention", "long"], ["theme", "Theme", "text"],
    ["themeExplain", "Theme in their words", "long"], ["keyMessage", "Key message", "long"]]],
  ["Materials & price", [
    ["costs", "Materials & who provides them", "flag"], ["costPerParticipant", "Cost per person (RM)", "money"],
    ["ticketPrice", "Ticket price (RM)", "money"], ["projectedAttendees", "Expected attendees", "int"]]],
  ["Facilitation & reflection", [
    ["opening", "Opening", "long"], ["instructions", "Step-by-step instructions", "long"], ["closing", "Closing", "long"],
    ["prompts", "Reflection prompts", "long"]]],
  ["Host's notes & contact", [
    ["help", "Help needed", "long"], ["accessibility", "Accessibility", "long"], ["other", "Anything else", "long"],
    ["contactName", "Contact name", "text"], ["contactEmail", "Contact email", "text"]]],
];
const RC_LABEL = Object.fromEntries(RC_SECTIONS.flatMap(([, rows]) => rows.map(([k, l]) => [k, l])));
const MODES = { physical: "In person", online: "Online", hybrid: "Hybrid" };
let EVENTS = [];

// Stored value → what the input shows (dates in local datetime-local form).
function rcValue(d, k, type) {
  const v = d[k];
  if (v === null || v === undefined) return "";
  if (type === "datetime") {
    const t = new Date(v);
    return isNaN(t) ? "" : new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }
  return String(v);
}

function rcShow(k, v) {
  if (v === "" || v === null || v === undefined) return "(empty)";
  if (k === "dateTime") return new Date(v).toLocaleString("en-MY", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
  if (k === "venueMode") return MODES[v] || v;
  return String(v);
}

function rcRow(ev, [k, label, type], flags) {
  const d = ev.data || {};
  const val = rcValue(d, k, type);
  const flag = flags[k];
  let input = "";
  if (type === "flag") {
    const ro = k === "costs"
      ? (d.costs || []).map((c) => `${c.item} (${c.who}, ${fmtRM(c.rm)})`).join(" · ") || "None listed"
      : k === "coverImage" ? (d.coverImage ? "Photo uploaded" : "No photo, colour cover") : `${(d.attachments || []).length} file(s)`;
    input = `<div class="rcro">${esc(ro)} <span class="muted">· only the host can change this, flag it to ask them</span></div>`;
  } else if (type === "long") {
    const rows = Math.min(8, Math.max(2, Math.ceil(val.length / 90) + (val.match(/\n/g) || []).length));
    input = `<textarea data-edit rows="${rows}">${esc(val)}</textarea>`;
  } else if (type === "mode") {
    input = `<select data-edit>${Object.entries(MODES).map(([m, l]) => `<option value="${m}" ${val === m ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  } else {
    const t = type === "datetime" ? 'type="datetime-local"' : type === "int" ? 'type="number" min="1" step="1"' : type === "money" ? 'type="number" min="0" step="0.01"' : 'type="text"';
    input = `<input data-edit ${t} value="${esc(val)}">`;
  }
  return `<div class="rcrow ${flag ? "flagged" : ""}" data-field="${k}" data-type="${type}" data-orig="${esc(val)}">
    <div class="rchead"><span>${esc(label)}</span>
      <label class="rcflag"><input type="checkbox" data-flag ${flag ? "checked" : ""}> Ask host to revise</label></div>
    ${input}
    <div class="rcwas" hidden></div>
    <input class="rcflagnote" data-flagnote placeholder="What should the host change here?" value="${esc(flag ? flag.note || "" : "")}" ${flag ? "" : "hidden"}>
  </div>`;
}

function openChanges(id) {
  const ev = EVENTS.find((e) => e.id === id);
  const box = $("rc_" + id);
  if (!ev || !box) return;
  // Re-opening an existing request starts from what was asked last time.
  const prev = ev.status === "needs_revision" && ev.revision ? ev.revision : null;
  const flags = Object.fromEntries(((prev && prev.flags) || []).map((f) => [f.field, f]));
  box.innerHTML = `<div class="rc" id="rcp_${esc(id)}">
    <h4>✏️ Request changes from the host</h4>
    <p class="rchelp">Fix small things yourself by editing a field (it turns green). The host sees each edit and accepts it when they resubmit.
      For anything only the host can answer, tick <strong>Ask host to revise</strong> and say what you need (it turns orange).
      Nothing is sent until you press <strong>Send to host</strong>.</p>
    <label style="font-size:12.5px;font-weight:700">Note to the host <span class="muted" style="font-weight:400">(shown in My Circles and in their email)</span></label>
    <textarea class="rcnote" data-note rows="3" placeholder="e.g. Lovely plan! A few tweaks before we publish…">${esc((prev && prev.note) || "")}</textarea>
    ${RC_SECTIONS.map(([title, rows], i) => `<details class="rcsec" ${i === 0 ? "open" : ""}>
      <summary>${esc(title)} <span class="rcbadge"></span></summary>
      ${rows.map((r) => rcRow(ev, r, flags)).join("")}
    </details>`).join("")}
    <div class="rcerr" role="alert"></div>
    <div class="rcfoot">
      <span class="rcsum">No edits or flags yet.</span>
      <button class="btn btn-outline btn-sm" onclick="closeChanges('${esc(id)}')">Cancel</button>
      <button class="btn btn-banana btn-sm" onclick="sendChanges('${esc(id)}', this)">Send to host</button>
    </div>
  </div>`;
  const panel = $("rcp_" + id);
  panel.addEventListener("input", () => rcRefresh(panel));
  panel.addEventListener("change", () => rcRefresh(panel));
  panel.addEventListener("click", (e) => {
    const undo = e.target.closest("[data-undo]");
    if (!undo) return;
    const row = undo.closest(".rcrow");
    row.querySelector("[data-edit]").value = row.dataset.orig;
    rcRefresh(panel);
  });
  // Flagged sections from an earlier request open up.
  panel.querySelectorAll("details.rcsec").forEach((sec) => { if (sec.querySelector(".rcrow.flagged")) sec.open = true; });
  rcRefresh(panel);
  $("act_" + id).style.display = "none";
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeChanges(id) {
  $("rc_" + id).innerHTML = "";
  $("act_" + id).style.display = "";
}

// Mark changed/flagged rows, show "was: …" under edits, count per section.
function rcRefresh(panel) {
  let edits = 0, flags = 0;
  panel.querySelectorAll("details.rcsec").forEach((sec) => {
    let e = 0, f = 0;
    sec.querySelectorAll(".rcrow").forEach((row) => {
      const inp = row.querySelector("[data-edit]");
      const changed = Boolean(inp) && inp.value.trim() !== row.dataset.orig.trim();
      const flagged = row.querySelector("[data-flag]").checked;
      row.classList.toggle("changed", changed);
      row.classList.toggle("flagged", flagged);
      row.querySelector("[data-flagnote]").hidden = !flagged;
      const was = row.querySelector(".rcwas");
      was.hidden = !changed;
      if (changed) {
        const orig = row.dataset.type === "datetime" && row.dataset.orig ? new Date(row.dataset.orig).toISOString() : row.dataset.orig;
        was.innerHTML = `Was: ${esc(rcShow(row.dataset.field, orig))} <button type="button" class="btn btn-outline btn-sm mini" data-undo>Undo</button>`;
      }
      e += changed; f += flagged;
    });
    sec.querySelector(".rcbadge").textContent = [e && `${e} edited`, f && `${f} flagged`].filter(Boolean).join(" · ");
    edits += e; flags += f;
  });
  panel.querySelector(".rcsum").textContent = edits || flags
    ? `${edits} field${edits === 1 ? "" : "s"} edited · ${flags} flagged for the host`
    : "No edits or flags yet.";
}

async function sendChanges(id, btn) {
  const panel = $("rcp_" + id);
  const err = panel.querySelector(".rcerr");
  err.textContent = "";
  const edits = {}, flags = {};
  panel.querySelectorAll(".rcrow").forEach((row) => {
    const k = row.dataset.field;
    const inp = row.querySelector("[data-edit]");
    if (inp && inp.value.trim() !== row.dataset.orig.trim()) {
      edits[k] = row.dataset.type === "datetime" && inp.value ? new Date(inp.value).toISOString() : inp.value;
    }
    if (row.querySelector("[data-flag]").checked) flags[k] = row.querySelector("[data-flagnote]").value.trim();
  });
  const note = panel.querySelector("[data-note]").value.trim();
  if (!note && !Object.keys(edits).length && !Object.keys(flags).length) {
    err.textContent = "Edit a field, flag one for the host, or write a note so they know what to change.";
    return;
  }
  const missing = Object.entries(flags).filter(([, v]) => !v).map(([k]) => RC_LABEL[k]);
  if (missing.length && !note) {
    err.textContent = `Say what to change for: ${missing.join(", ")} (or add a note to the host).`;
    return;
  }
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const r = await api(`/api/admin/harmoni/events/${encodeURIComponent(id)}/request-changes`, {
      method: "POST", body: JSON.stringify({ note, edits, flags }),
    });
    emailNotice(r.email);
    showDash();
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false;
    btn.textContent = "Send to host";
  }
}

// The last change request on a proposal, and what the host did with it.
function revisionBox(ev) {
  const r = ev.revision;
  if (!r || !["under_review", "needs_revision"].includes(ev.status)) return "";
  const dt = (s) => new Date(s).toLocaleString("en-MY", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  const changeList = (list) => `<ul>${list.map((c) => `<li><strong>${esc(c.label)}:</strong> <span class="from">${esc(rcShow(c.field, c.from))}</span> → ${esc(rcShow(c.field, c.to))}</li>`).join("")}</ul>`;
  const asked = [
    r.note ? `<h5>Note to host</h5><div class="note">${esc(r.note)}</div>` : "",
    r.flags && r.flags.length ? `<h5>Flagged for the host (${r.flags.length})</h5><ul>${r.flags.map((f) => `<li><strong>${esc(f.label)}</strong>${f.note ? `: ${esc(f.note)}` : ""}</li>`).join("")}</ul>` : "",
    r.changes && r.changes.length ? `<h5>Edited by WIP (${r.changes.length})</h5>${changeList(r.changes)}` : "",
  ].join("");
  const back = ev.status === "under_review" && r.resubmittedAt
    ? `<h5>✅ Host resubmitted ${esc(dt(r.resubmittedAt))}</h5>${r.hostChanges && r.hostChanges.length
        ? `<div class="muted">They accepted WIP's edits and changed:</div>${changeList(r.hostChanges)}`
        : `<div class="muted">They accepted WIP's edits and changed nothing else.</div>`}`
    : ev.status === "needs_revision" ? `<h5>⏳ Waiting on the host</h5><div class="muted">They can edit and resubmit from My Circles.</div>` : "";
  return `<div class="revbox"><h5>Changes requested ${esc(dt(r.requestedAt))}</h5>${asked}${back}</div>`;
}

function render(events) {
  EVENTS = events;
  const groups = [
    ["under_review", "Needs review", "proposals waiting for your decision"],
    ["needs_revision", "Waiting on the host", "changes requested; the host can edit and resubmit"],
    ["approved", "Live on the member hub", "members can RSVP to these now"],
    ["completed", "Completed", "wrapped up Circles"],
    ["rejected", "Rejected", ""],
    ["cancelled", "Cancelled", ""],
  ];
  let html = "";
  for (const [status, title, sub] of groups) {
    const list = events.filter((ev) => ev.status === status);
    html += `<div class="sec"><h3 style="font-size:16px">${esc(title)}</h3><span class="count">${list.length}</span>
      ${sub ? `<span class="muted" style="font-size:12px">${esc(sub)}</span>` : ""}</div>`;
    html += list.length ? list.map(proposalCard).join("") : `<div class="muted" style="font-size:13px;margin-bottom:8px">None.</div>`;
  }
  html += `<div class="sec"><h3 style="font-size:16px">Members</h3><span class="count" id="memCount">…</span>
    <span class="muted" style="font-size:12px">accounts that joined with the invite code</span></div>
    <div class="card tablewrap" id="memList"><div class="muted" style="font-size:13px">Loading…</div></div>`;
  $("content").innerHTML = html;
  loadMembers();
}

async function savePaymentLink(id) {
  try {
    await api(`/api/admin/harmoni/events/${encodeURIComponent(id)}/payment`, {
      method: "POST", body: JSON.stringify({ paymentUrl: $("pay_" + id).value.trim() }),
    });
    showDash();
  } catch (e) { alert(e.message); }
}

async function rsvpAction(id, key, action) {
  if (action === "remove" && !confirm("Remove this RSVP? Their seat is freed. If they paid, arrange the refund separately.")) return;
  try {
    await api(`/api/admin/harmoni/events/${encodeURIComponent(id)}/rsvp`, { method: "POST", body: JSON.stringify({ key, action }) });
    showDash();
  } catch (e) { alert(e.message); }
}

const ROLE_LABEL = { fighter: "Mental health fighter", caregiver: "Caregiver", practitioner: "Practitioner", leader: "Community leader / volunteer", public: "General public" };

async function loadMembers() {
  try {
    const { members } = await api("/api/admin/harmoni/members");
    $("memCount").textContent = members.length;
    $("memList").innerHTML = members.length
      ? `<table class="memtable"><tr><th></th><th>Name</th><th>Community role</th><th>Location</th><th>Email</th><th>Sign-in</th><th>Joined</th><th class="n">Circles joined</th><th class="n">Proposed</th><th class="n">Hosted</th></tr>` +
        members.map((m) => `<tr>
          <td>${m.photo ? `<img class="mav" src="${esc(m.photo)}" alt="">` : `<span class="mav">${esc((m.name || "?").trim().charAt(0).toUpperCase())}</span>`}</td>
          <td><strong>${esc(m.name)}</strong>${m.profileComplete ? "" : ' <span class="muted" style="font-size:11px">profile unfinished</span>'}</td>
          <td>${(m.roles || []).map((r) => esc(ROLE_LABEL[r] || r)).join(", ") || '<span class="muted">—</span>'}</td>
          <td>${esc([m.city, m.state].filter(Boolean).join(", ")) || '<span class="muted">—</span>'}</td>
          <td>${esc(m.email || "")}</td><td>${m.provider === "google" ? "Google" : "Email"}</td>
          <td>${esc(new Date(m.joinedAt).toLocaleDateString("en-MY", { day: "numeric", month: "short", year: "numeric" }))}</td>
          <td class="n">${m.counts.joined}</td><td class="n">${m.counts.proposed}</td><td class="n">${m.counts.hosted}</td></tr>`).join("") + `</table>`
      : '<div class="muted" style="font-size:13px">No members yet. They appear here after signing in and entering the invite code.</div>';
  } catch (e) {
    $("memList").innerHTML = `<div class="muted" style="font-size:13px">⚠️ ${esc(e.message)}</div>`;
  }
}

async function setStatus(id, status) {
  let note;
  if (status === "needs_revision") {
    note = prompt("What should the host change? They'll see this in My Circles and in their email:", "");
    if (note === null) return;
    if (!note.trim()) return alert("Add a note so the host knows what to change.");
  }
  if (status === "rejected" || status === "cancelled") {
    note = prompt("Optional note for the host (shown in My Circles and in their email):", "");
    if (note === null) return;
  }
  try {
    const r = await api(`/api/admin/harmoni/events/${encodeURIComponent(id)}/status`, {
      method: "POST",
      body: JSON.stringify({ status, note }),
    });
    emailNotice(r.email);
    showDash();
  } catch (e) { alert(e.message); }
}

// After an action that emails the host: a banner saying whether it went out.
function emailNotice(e) {
  const box = $("emailNotice");
  if (!e) { box.hidden = true; return; }
  box.hidden = false;
  box.className = "emailnotice " + (e.sent ? "ok" : "bad");
  box.innerHTML = e.sent
    ? `✉️ Email sent to the host (${esc(e.to)}).`
    : e.skipped
      ? `✉️ No email to the host: ${esc(e.skipped)}.`
      : `⚠️ The email to the host${e.to ? ` (${esc(e.to)})` : ""} wasn't sent: ${esc(e.error || "unknown error")}`;
  box.innerHTML += ` <button class="btn btn-outline btn-sm mini" onclick="this.parentNode.hidden=true">OK</button>`;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
if (token) showDash(); else $("login").style.display = "block";
