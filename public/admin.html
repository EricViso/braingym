<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Seni Scape Survey</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f3fa; color: #2b2540; padding-bottom: 40px;
  }
  header {
    background: #4a3580; color: #fff; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1.1rem; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }

  /* login */
  #login {
    max-width: 340px; margin: 18vh auto; background: #fff; border-radius: 14px;
    padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center;
  }
  #login h2 { margin-bottom: 16px; font-size: 1.05rem; }
  #login input {
    width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd;
    border-radius: 10px; margin-bottom: 12px; outline: none;
  }
  #login button { width: 100%; padding: 12px; background: #4a3580; color: #fff; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; }
  #loginError { color: #b3261e; font-size: .85rem; margin-top: 10px; min-height: 1em; }

  /* dashboard */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .num { font-size: 1.9rem; font-weight: 800; color: #4a3580; }
  .card .lbl { font-size: .78rem; color: #777; margin-top: 4px; }
  .card.warn .num { color: #c2410c; }

  section { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  section h2 { font-size: .95rem; margin-bottom: 14px; color: #4a3580; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: .82rem; }
  .bar-row .name { flex: 0 0 46%; text-align: right; color: #555; }
  .bar-row .track { flex: 1; background: #eee9f7; border-radius: 6px; height: 18px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: linear-gradient(90deg, #7c5cbf, #9d7fe0); border-radius: 6px; }
  .bar-row .val { flex: 0 0 44px; font-weight: 700; color: #4a3580; }

  #insightsBtn { background: #4a3580; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: .9rem; }
  #insightsOut { margin-top: 14px; font-size: .9rem; line-height: 1.55; white-space: pre-wrap; }

  details.resp { border: 1px solid #eee; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  details.resp summary { cursor: pointer; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: #eee9f7; color: #4a3580; }
  .tag.flag { background: #fde8e8; color: #b3261e; font-weight: 700; }
  .tag.pos { background: #e6f6ec; color: #1a7f4b; }
  .tag.neg { background: #fde8e8; color: #b3261e; }
  .resp .summary-txt { font-size: .85rem; color: #555; margin: 10px 0; }
  .resp table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 8px; }
  .resp td { border-top: 1px solid #f0eef6; padding: 6px 8px; vertical-align: top; }
  .resp td:first-child { color: #777; width: 38%; }
  .muted { color: #999; font-size: .88rem; }
</style>
</head>
<body>

<div id="login">
  <h2>🔐 Admin Login</h2>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <button onclick="login()">Enter</button>
  <div id="loginError"></div>
</div>

<div id="dash" style="display:none">
  <header>
    <h1>📊 Seni Scape - Admin Analytics</h1>
    <button onclick="logout()">Logout</button>
  </header>
  <main>
    <div class="cards" id="cards"></div>

    <section>
      <h2>Average Scores (1-5 scales)</h2>
      <div id="averages"></div>
    </section>

    <section>
      <h2>Distributions</h2>
      <div id="distributions"></div>
    </section>

    <section>
      <h2>🤖 AI Insights (whole dataset)</h2>
      <button id="insightsBtn" onclick="genInsights()">Generate AI insights</button>
      <div id="insightsOut"></div>
    </section>

    <section>
      <h2>Individual Responses</h2>
      <div id="responses"></div>
    </section>
  </main>
</div>

<script>
let token = sessionStorage.getItem("adminToken") || "";

const FIELD_LABELS = {
  name: "Name", age_group: "Age group", gender: "Gender", location: "Location",
  email: "Email", phone: "Phone", creative_expression: "Creative expression",
  community_role: "Community role",
  pre_happy_safe: "Pre: happy & safe (1-5)", pre_self_critical: "Pre: hard on myself (1-5)",
  pre_self_worth: "Pre: I am important (1-5)", pre_mind_heavy: "Pre: mind heavy (1-5)",
  pre_mood: "Mood brought in", pre_heavy_feeling: "Heavy feeling to release",
  personal_experience: "Personal creative experience", emotions_while_creating: "Emotions while creating",
  mental_health_understanding: "Mental health understanding (1-5)", impactful_zone: "Most impactful zone",
  post_understand_feelings: "Post: understood feelings (1-5)", post_self_worth: "Post: valuable & strong (1-5)",
  post_mind_lighter: "Post: mind lighter (1-5)", post_mind_peaceful: "Post: peaceful (1-5)",
  post_strength_lesson: "Lesson on strength/self-love", post_self_view_change: "Change in self-view",
  booth_experience: "Booth experience (A-E)", suggestions: "Suggestions",
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Server error");
  return data;
}

async function login() {
  const pw = document.getElementById("pw").value;
  document.getElementById("loginError").textContent = "";
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    token = data.token;
    sessionStorage.setItem("adminToken", token);
    showDash();
  } catch (e) {
    document.getElementById("loginError").textContent = e.message;
  }
}

function logout() {
  token = "";
  sessionStorage.removeItem("adminToken");
  document.getElementById("dash").style.display = "none";
  document.getElementById("login").style.display = "block";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function showDash() {
  document.getElementById("login").style.display = "none";
  document.getElementById("dash").style.display = "block";
  const { stats, responses } = await api("/api/admin/data");

  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="num">${stats.total}</div><div class="lbl">Total responses</div></div>
    <div class="card ${stats.flagged ? "warn" : ""}"><div class="num">${stats.flagged}</div><div class="lbl">Flagged for follow-up</div></div>`;

  document.getElementById("averages").innerHTML =
    Object.values(stats.averages).map((a) => bar(a.label, a.average, 5, a.average === null ? "—" : a.average + " (n=" + a.count + ")")).join("") ||
    '<div class="muted">No data yet.</div>';

  document.getElementById("distributions").innerHTML =
    Object.values(stats.distributions).map((d) => {
      const entries = Object.entries(d.counts).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return "";
      const max = entries[0][1];
      return `<h2 style="margin-top:14px">${esc(d.label)}</h2>` +
        entries.map(([k, v]) => bar(k, v, max, v)).join("");
    }).join("") || '<div class="muted">No data yet.</div>';

  document.getElementById("responses").innerHTML = responses.length
    ? responses.slice().reverse().map(renderResponse).join("")
    : '<div class="muted">No responses yet. Share the survey link to start collecting! 🌱</div>';
}

function bar(label, value, max, display) {
  const pct = value === null ? 0 : Math.round((value / max) * 100);
  return `<div class="bar-row">
    <div class="name">${esc(label)}</div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="val">${esc(display)}</div>
  </div>`;
}

function renderResponse(r) {
  const d = r.data || {};
  const a = r.analysis || {};
  const who = d.name ? esc(d.name) : "Anonymous";
  const when = new Date(r.submittedAt).toLocaleString();
  const tags = [
    a.sentiment ? `<span class="tag ${a.sentiment === "positive" ? "pos" : a.sentiment === "negative" ? "neg" : ""}">${esc(a.sentiment)}</span>` : "",
    a.wellbeing_shift ? `<span class="tag">${esc(a.wellbeing_shift)}</span>` : "",
    a.concern_flag ? `<span class="tag flag">⚠ follow-up</span>` : "",
    ...(Array.isArray(a.themes) ? a.themes.map((t) => `<span class="tag">${esc(t)}</span>`) : []),
  ].join(" ");
  const rows = Object.entries(FIELD_LABELS)
    .filter(([k]) => d[k] !== null && d[k] !== undefined && d[k] !== "")
    .map(([k, lbl]) => `<tr><td>${esc(lbl)}</td><td>${esc(d[k])}</td></tr>`)
    .join("");
  return `<details class="resp">
    <summary><strong>${who}</strong> <span class="muted">${esc(when)}</span> ${tags}</summary>
    ${a.summary ? `<div class="summary-txt">🤖 ${esc(a.summary)}</div>` : ""}
    ${a.concern_note ? `<div class="summary-txt" style="color:#b3261e">⚠ ${esc(a.concern_note)}</div>` : ""}
    <table>${rows}</table>
  </details>`;
}

async function genInsights() {
  const btn = document.getElementById("insightsBtn");
  const out = document.getElementById("insightsOut");
  btn.disabled = true;
  out.textContent = "Analysing all responses with DeepSeek...";
  try {
    const { insights } = await api("/api/admin/insights", { method: "POST", body: "{}" });
    out.textContent = insights;
  } catch (e) {
    out.textContent = "⚠️ " + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
if (token) showDash().catch(logout);
</script>
</body>
</html>
